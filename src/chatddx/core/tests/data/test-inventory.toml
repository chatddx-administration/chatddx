extends = ["../../../data/test/test-inventory.toml"]

[scorer.reciprocal_rank]
command = "reciprocal_rank"

[output_type.ranked-diagnoses]
definition = { type = "array", items = { type = "string" } }

[agent.diagnostician]
instructions = "list plausible diagnoses, most likely first"
connection = "connection-1"
