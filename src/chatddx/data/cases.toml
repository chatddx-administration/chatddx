# The case corpus. A case is its vignette, read from cases/<name>.txt next
# to this file, tags that say which dataset it came from, the language it is
# written in (EDN's cases are Swedish, the rest English, Dutch Fall's by
# translation), and its targets: what it is expected to yield, by kind.
# `diagnosis` is read by `reciprocal_rank` and `first_mention`, and `warning`
# and `disposition` by their `mentions` scorers (inventory/scorers.toml);
# `dont_miss` has no scorer yet.
#
# A target is its plain words, `text`, and the pattern the scorers find it
# by, `pattern`: whole words, `*` ending a stem, `&` both, `|` either
# (`chatddx.scoring.scorers.patterns`). Either may be left out, and is then
# shown as missing. `targets.warning = false` says that the case should
# raise no warning. `# guessed` marks a target guessed from the case's text,
# for people: nothing reads it. The Swedish cases' patterns name their words
# in both languages, since what chatddx sends with them is English.

