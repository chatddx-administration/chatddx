[llm.qwen3-8b-awq]
snapshot = "/nix/store/vmm0f85gk4i6ymz1j8hlk9mfyjy5jq8a-Qwen3-8B-AWQ"  # guessed
source = "Qwen/Qwen3-8B-AWQ@d8dfb663dd1029e5ca5cf984c2ed338bcba077d3"  # guessed
tags = ["open-weights"]

[llm.qwen3-8b-awq.specs]
family = "qwen3"
parameters_b = 8.2
quantization = "awq"
context_length = 32768
licence = "apache-2.0"

[llm.qwen3-8b-awq.facts.reasoning]
default = "on"
off = { chat_template_kwargs = { enable_thinking = false } }
on = { chat_template_kwargs = { enable_thinking = true } }
# no effort levels: every effort is "on"
minimal = "on"
low = "on"
medium = "on"
high = "on"
xhigh = "on"
budget = { field = "thinking_token_budget", needs = "reasoning_parser" }

# the model card, per mode
[llm.qwen3-8b-awq.facts.sampling.recommended]
on = { temperature = 0.6, top_p = 0.95, top_k = 20, presence_penalty = 1.5 }  # guessed: presence_penalty, for quantized models
off = { temperature = 0.7, top_p = 0.8, top_k = 20, presence_penalty = 1.5 }  # guessed: presence_penalty, for quantized models

# what vLLM gives a field the request leaves out (--generation-config auto)
[llm.qwen3-8b-awq.facts.sampling.generation_config]
temperature = 0.6
top_p = 0.95
top_k = 20

[llm.qwen3-8b-awq.facts.coercion]
default = "native"  # guessed: what `auto` resolves to
native = { needs = "reasoning_parser" }
tool = { needs = "reasoning_parser" }
prompted = {}

# pydantic-ai profile overrides
[llm.qwen3-8b-awq.facts.profile]
supports_json_schema_output = true
ignore_streamed_leading_whitespace = true

