extends = ["some.toml"]

[agent.agent-1]
instructions = "hello 1"
sampling_params = "sampling_params-1"
connection = "connection-1"
output_type = "output_type-1"
tool_group = "tool_group-1"

[agent.agent-2]
instructions = "hello 2"
sampling_params = ["sampling_params-1", "sampling_params-2"]
connection = "connection-1"
output_type = "output_type-1"

[agent.agent-3]
extends = ["agent-1", "agent-2"]
instructions = "hello 3"
connection = "connection-1"
output_type = "output_type-2"
tool_group = "tool_group-1"

[connection.connection-1]
model = "Test/test-1"
provider = "vllm"
endpoint = "http://example-1.com/v1/"

[connection.connection-2]
model = "Test/test-2"
provider = "vllm"
endpoint = "http://example-2.com/v1/"

[connection.connection-2.profile]
profile_1 = true
profile_2 = "false"

[output_type.output_type-1]
definition_path = "./output_types/1.json"

[output_type.output_type-2]
definition_path = "./output_types/2.json"

[sampling_params.sampling_params-1]
temperature = 0.7
max_tokens = 150
stop_sequences = ["\\n\\n", "END"]

[sampling_params.sampling_params-2]
max_tokens = 155
seed = 0
stop_sequences = ["END"]

[tool.tool-1]
command = "tool-1"
type = "function"
parameters_path = "./output_types/1.json"

[tool.tool-2]
command = "tool-2"
type = "function"
parameters_path = "./output_types/1.json"

[tool.tool-3]
command = "tool-3"
type = "function"
parameters_path = "./output_types/2.json"

[tool_group.tool_group-1]
instructions = "Tool group instructions 1"
tools = [
  "tool-1",
  "tool-2",
  "tool-3",
]

[case.case-1]
payload = "case payload 1"
tags = ["tag-1", "tag-2"]
expects = ["expect-1-a", "expect-1-b"]

[case.case-2]
payload = "case payload 2"
expects = ["expect-2-a", "expect-2-b"]

[expect.expect-1-a]
scorer = "scorer-a"
payload = "expect payload 1 for scorer a"

[expect.expect-1-b]
scorer = "scorer-b"
payload = "expect payload 1 for scorer b"

[expect.expect-2-a]
scorer = "scorer-a"
payload = "expect payload 2 for scorer a"

[expect.expect-2-b]
scorer = "scorer-b"
payload = "expect payload 2 for scorer b"

[scorer.scorer-a]
command = "scorer-a command"

[scorer.scorer-b]
command = "scorer-b command"
