# is expected: `diagnosis`, read by `reciprocal_rank` and `first_mention`;
# `warning` and `disposition`, read by their `mentions` scorers. These were
# the cases' `expects` in cases.toml; targets are inspect's, not the
# registry's, so the inventory no longer carries them (new-datamodel.md §7).
