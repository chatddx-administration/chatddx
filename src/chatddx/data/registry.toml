# src/chatddx/data/registry.toml

[agent."qwen-3b"]
partial = true
connection = "qwen3-8b"
instructions = "Give medical assistance"
sampling_params = ["no-thinking"]

[agent."gpt-4o"]
partial = true
connection = "openai-gpt-4o"
instructions = "Give medical assistance"
sampling_params = ["standard-openai"]

[agent."gpt-oss-20b"]
partial = true
connection = "gpt-oss-20b"
instructions = "Give medical assistance"
sampling_params = ["low-reasoning"]

[agent."gpt-oss-20b web"]
connection = "gpt-oss-20b"
instructions = "Assist the user. \n\n{{ tool_group_instructions }}"
output_type = "free-text"
tool_group = "web"

[agent."qwen-3b swift tool-coerced"]
extends = ["qwen-3b"]
output_type = "swift-tool"

[agent."qwen-3b swift prompt-coerced"]
extends = ["qwen-3b"]
output_type = "swift-prompt"

[agent."qwen-3b swift guided-decoding"]
extends = ["qwen-3b"]
output_type = "swift-native"

[agent."qwen-3b swift seed=0"]
extends = ["qwen-3b"]
sampling_params = ["deterministic", "no-thinking"]
output_type = "swift-native"

[agent."qwen-3b free-text"]
extends = ["qwen-3b"]
output_type = "free-text"

[agent."qwen-3b free-text seed=0"]
extends = ["qwen-3b"]
sampling_params = ["deterministic", "no-thinking"]
output_type = "free-text"

[agent."gpt-4o swift tool-coerced"]
extends = ["gpt-4o"]
output_type = "swift-tool"

[agent."gpt-4o swift prompt-coerced"]
extends = ["gpt-4o"]
output_type = "swift-prompt"

[agent."gpt-4o swift guided-decoding"]
extends = ["gpt-4o"]
output_type = "swift-native"

[agent."gpt-4o seed=0"]
extends = ["gpt-4o"]
sampling_params = ["deterministic", "standard-openai"]
output_type = "swift-native"

[agent."gpt-4o free-text"]
extends = ["gpt-4o"]
output_type = "free-text"

[agent."gpt-4o free-text seed=0"]
extends = ["gpt-4o"]
sampling_params = ["deterministic", "standard-openai"]
output_type = "free-text"

[agent."gpt-oss-20b free-text deterministic low-reasoning"]
extends = ["gpt-oss-20b"]
sampling_params = ["deterministic", "low-reasoning"]
output_type = "free-text"

[agent."gpt-oss-20b swift deterministic low-reasoning"]
extends = ["gpt-oss-20b"]
sampling_params = ["deterministic", "low-reasoning"]
output_type = "swift-tool"

[connection.qwen3-8b]
model = "Qwen/Qwen3-8B-AWQ"
provider = "vllm"
endpoint = "http://pelle.km:12009/v1/"

[connection.qwen3-8b.profile]
supports_json_schema_output = true
ignore_streamed_leading_whitespace = true

[connection.openai-gpt-4o]
model = "gpt-4o"
provider = "openai"
endpoint = "https://api.openai.com/v1/"

[connection.openai-gpt-4o.profile]
supports_json_schema_output = true
ignore_streamed_leading_whitespace = false

[connection.gpt-oss-20b]
model = "openai/gpt-oss-20b"
provider = "vllm"
endpoint = "http://malborg.km:12009/v1/"

[connection.gpt-oss-20b.profile]
ignore_streamed_leading_whitespace = true
supports_json_schema_output = true

[sampling_params.deterministic]
seed = 0

[sampling_params.no-thinking]
provider_params_path = "./provider_params/disable_thinking.json"

[sampling_params.low-reasoning]
provider_params.openai_reasoning_effort = "low"

[sampling_params.standard-openai]
temperature = 0.7
max_tokens = 4096

[output_type.swift-tool]
definition_path = "./output_types/swift.json"
coercion_strategy = "tool"

[output_type.swift-native]
definition_path = "./output_types/swift.json"
coercion_strategy = "native"

[output_type.swift-prompt]
definition_path = "./output_types/swift.json"
coercion_strategy = "prompted"

[output_type.free-text]
# unstructured free text

[tool.web_search]
command = "web_search"
type = "function"
description = "Search the web for up-to-date information"

[tool_group.web]
instructions = "You have access to a web_search tool. Use it whenever you need current facts, documentation, or anything you're not confident about from memory, instead of guessing."
tools = ["web_search"]
