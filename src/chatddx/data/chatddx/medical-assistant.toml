extends = ["connections.toml", "lib.toml"]

[agent.medical-assistant-form]
partial = true
instructions = "fill in the management plan based on the case"

[agent.medical-assistant-free-text]
partial = true
instructions = "list plausible diagnoses"

[agent."gpt-oss-20b management_plan_v1 seed-locked low-reasoning"]
extends = ["medical-assistant-form"]
connection = "gpt-oss-20b"
sampling_params = ["seed-locked", "low-reasoning"]
output_type = "management_plan_v1"

[agent."qwen3-8b management_plan_v1 seed-locked disable-thinking"]
extends = ["medical-assistant-form"]
connection = "qwen3-8b"
sampling_params = ["seed-locked", "disable-thinking"]
output_type = "management_plan_v1"

[agent."gpt-oss-20b diagnoses-tool seed-locked low-reasoning"]
extends = ["medical-assistant-free-text"]
connection = "gpt-oss-20b"
sampling_params = ["seed-locked", "low-reasoning"]
output_type = "diagnoses tool"

[agent."qwen3-8b diagnoses seed-locked disable-thinking"]
extends = ["medical-assistant-free-text"]
connection = "qwen3-8b"
sampling_params = ["seed-locked", "disable-thinking"]
output_type = "diagnoses"

[output_type.management_plan_v1]
definition_path = "./output_types/management_plan_v1.toml"
partial = true

[output_type.diagnoses]
definition_path = "./output_types/diagnoses.json"
partial = true

[output_type."management_plan_v1 tool"]
extends = ["management_plan_v1"]
coercion_strategy = "tool"

[output_type."management_plan_v1 native"]
extends = ["management_plan_v1"]
coercion_strategy = "native"

[output_type."management_plan_v1 prompted"]
extends = ["management_plan_v1"]
coercion_strategy = "prompted"

[output_type."diagnoses tool"]
extends = ["diagnoses"]
coercion_strategy = "tool"

[output_type."diagnoses native"]
extends = ["diagnoses"]
coercion_strategy = "native"

[output_type."diagnoses prompted"]
extends = ["diagnoses"]
coercion_strategy = "prompted"
