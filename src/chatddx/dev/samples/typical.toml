reasoning = '''
Okay, let me work through this. Sudden, continuous upper abdominal pain since last night, radiating to the back between the shoulder blades, VAS 8 at its worst, not touched by paracetamol and better after diclofenac and morphine. Known gallstones that never gave trouble before. No fever, no chills, normal stools, normal urine colour, eating and drinking normally.

On examination the punctum maximum is in the left upper abdomen, no release pain, no palpable mass, both femoral pulses present. Heart rate 97, blood pressure 165/102, respiratory rate 24, temperature 36. Labs: normal leukocytes and differential, normal CRP, normal liver values, normal renal function; only a very mildly raised CK.

The most likely picture is biliary colic: known stones, pain radiating to the back, and normal inflammatory markers and liver tests argue against cholecystitis and cholangitis for now. But pain between the shoulder blades together with a blood pressure of 165/102 means aortic dissection has to be excluded before she goes home. Pancreatitis is possible with gallstones and back pain, and lipase isn't reported, so it needs measuring. The left upper quadrant could also be gastric, a peptic ulcer, and she has just had an NSAID. An inferior myocardial infarction can present as epigastric pain, and the CK is mildly raised, so an ECG and a troponin belong in the workup.

Workup: lipase, troponin and an ECG urgently, blood pressure in both arms, ultrasound of the upper abdomen, and CT angiography of the aorta if dissection can't be excluded at the bedside. Treatment: analgesia now, and nil by mouth with fluids if pancreatitis is confirmed.

Disposition: observation in the emergency department; once dissection, pancreatitis and cardiac causes are excluded and the pain settles, discharge home with an outpatient ultrasound and a surgical referral for an elective cholecystectomy.
'''
