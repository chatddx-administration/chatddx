[project]
name = "chatddx"
version = "0.0.0+dev"
description = "chatddx backend"
requires-python = ">=3.12"
dependencies = [
  "Django>=6.1.1",
  "django-cors-headers>=4.9.0",
  "django-crispy-forms>=2.7",
  "django-fernet-encrypted-fields>=0.4.0",
  "django-modeltranslation>=0.20.6",
  "django-ninja>=1.7.0",
  "django-unfold>=0.105.0",
  "gunicorn>=26.2.0",
  "inspect-ai>=0.3.263",
  "jinja2>=3.1.6",
  "jsonschema>=4.26.0",
  "markdown>=3.10.3",
  "orjson>=3.12.0",
  "pgqueuer[psycopg]>=1.3.2",
  "psycopg[binary]>=3.3.5",
  "pydantic-ai-slim[openai,spec]>=2.41.0",
  "time-machine>=3.5.1",
  "tomli-w>=1.2.0",
]

[project.scripts]
chatddx = "chatddx.manage:app"
django = "chatddx.django.manage:main"

[dependency-groups]
analysis = ["pandas>=3.0.6", "pyarrow>=25.0.1"]
dev = [
  { include-group = "analysis" },
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typing" },
]
lint = ["ruff>=0.15.0"]
test = [
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "pytest-django>=4.11.1",
  "pytest-recording>=0.13.4",
]
typing = [
  "basedpyright>=1.40.1",
  "django-types>=0.24.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src"]
ignore = ["**/migrations/*"]
reportAny = false
reportExplicitAny = false

[tool.pytest.ini_options]
addopts = ["--liveserver", "localhost:8082"]
testpaths = ["src/chatddx"]
markers = [
  "network: requires network access to hosts outside the sandbox. Deselect with -m 'not network'.",
  "slow: provisions the live inventory, or runs inspect, end to end. Deselect with -m 'not slow'.",
]
django_find_project = false

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true
